name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux jq shellcheck

      - name: Tool versions
        run: |
          bash --version | head -1
          tmux -V
          jq --version

      - name: Syntax check (bash -n)
        run: |
          bash -n bin/fleet
          for f in lib/*.sh hooks/*.sh tests/*.sh; do bash -n "$f"; done

      - name: ShellCheck (shipping code — strict, no exclusions)
        # Shipping code (the CLI, sourced libs, hooks) is gated at the strictest
        # standard severity with ZERO exclusions — any finding here fails CI.
        # .shellcheckrc enables external-sources (follow `source`) + documents SC2016.
        # Genuine false positives (e.g. nameref-consumed vars, literal-backslash
        # case patterns) carry a per-line `# shellcheck disable=` with a reason.
        run: shellcheck -S style bin/fleet lib/responder.sh hooks/*.sh

      - name: ShellCheck (test harness — calibrated)
        # The bash test harness legitimately uses idioms shellcheck flags as
        # style/info: sourcing runtime-computed paths (SC1090/SC1091), defining
        # mock functions that look unreachable (SC2317), setting fixture vars the
        # sourced code-under-test reads (SC2034), isolating state in subshells
        # (SC2030/SC2031), A&&B||C best-effort chains (SC2015), and locale-plain
        # tr/case ranges + ls|grep|wc in assertion scaffolding (SC2018/SC2019/
        # SC2010/SC2126). These are harness patterns, not defects. Real breakage
        # is caught by the Smoke test below, which actually RUNS the suite.
        run: shellcheck -S style --exclude=SC1090,SC1091,SC2317,SC2034,SC2030,SC2031,SC2015,SC2018,SC2019,SC2010,SC2126 tests/*.sh

      - name: Smoke test
        run: |
          tests/smoke.sh
          tests/multi-workspace.sh
