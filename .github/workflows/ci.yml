name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux jq shellcheck

      - name: Tool versions
        run: |
          bash --version | head -1
          tmux -V
          jq --version

      - name: Syntax check (bash -n)
        run: |
          bash -n bin/fleet
          for f in lib/*.sh hooks/*.sh tests/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        # -x follows `source` directives so lib/*.sh are checked in context
        # (cross-file vars resolve); entry points cover every lib transitively.
        run: shellcheck -x -S warning bin/fleet hooks/*.sh tests/*.sh

      - name: Smoke test
        run: tests/smoke.sh
